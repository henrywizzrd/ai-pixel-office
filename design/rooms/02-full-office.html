<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bước 2 · Toàn bộ văn phòng</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1b1820; color: #f0e6d6;
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header { text-align: center; padding: 12px 10px 2px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: 3px; color: #e8a96a; }
  .sub { font-size: 12px; opacity: .7; margin-top: 3px; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 8px; }
  button {
    font: inherit; font-size: 12px; color: #f0e6d6; background: #3a3247;
    border: 2px solid #5e5275; border-radius: 3px; padding: 5px 9px; cursor: pointer;
  }
  button.on { background: #e8a96a; color: #2a1c12; border-color: #ffcf98; }
  #stage { flex: 1; overflow: auto; min-height: 0; cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  #wrap { position: relative; margin: auto; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .label {
    position: absolute; transform: translate(-50%, -50%); pointer-events: none;
    background: rgba(27, 24, 32, .82); border: 2px solid #5e5275; border-radius: 3px;
    padding: 2px 6px; font-size: 12px; white-space: nowrap;
  }
  #labels.hidden { display: none; }
  #tip {
    position: fixed; pointer-events: none; display: none; z-index: 5;
    background: #1b1820; border: 2px solid #5e5275; padding: 3px 6px; font-size: 12px; border-radius: 3px;
  }
</style>
</head>
<body>
  <header>
    <h1>AI PIXEL OFFICE</h1>
    <div class="sub">Bước 2: Toàn bộ văn phòng (40 × 40 ô, mỗi ô 16px)</div>
  </header>
  <div class="controls">
    <button data-zoom="fit" class="on">Vừa màn hình</button>
    <button data-zoom="2">2x</button>
    <button data-zoom="3">3x</button>
    <button id="btn-labels" class="on">Tên phòng</button>
    <button id="btn-grid">Lưới ô</button>
    <button id="btn-night">Ban đêm</button>
    <button id="btn-png">Tải PNG</button>
  </div>
  <div id="stage"><div id="wrap"><canvas id="cv"></canvas><canvas id="ov"></canvas><div id="labels"></div></div></div>
  <div id="tip"></div>

<script>
// =====================================================================
//  CẤU HÌNH BỐ CỤC (đơn vị: ô 16px)
// =====================================================================
const T = 16;
const COLS = 40, ROWS = 40;
const OX = 10, OY = 10;                 // lề khung ngoài
const W = COLS * T + OX * 2;
const H = ROWS * T + OY * 2 + 14;       // chừa chỗ thảm cửa chính
const FACE = 2;                          // tường sau cao 2 ô

// Các phòng: mỗi phòng có thể gồm nhiều hình chữ nhật (sảnh hình chữ L)
const ROOMS = {
  ceo:     { name: 'Phòng giám đốc', rects: [[0, 0, 20, 14]] },
  dev:     { name: 'Khu Dev',         rects: [[20, 0, 20, 18]] },
  library: { name: 'Thư viện',        rects: [[0, 14, 14, 11]] },
  pantry:  { name: 'Pantry',          rects: [[0, 25, 14, 15]] },
  meeting: { name: 'Phòng họp',       rects: [[26, 18, 14, 22]] },
  lobby:   { name: 'Sảnh',            rects: [[14, 14, 6, 4], [14, 18, 12, 22]] },
};

// Cửa giữa các phòng
//  'h': cửa trên cạnh ngang, nằm giữa hàng r-1 và r, từ cột c, rộng w ô
//  'v': cửa trên cạnh dọc, nằm giữa cột c-1 và c, từ hàng r, cao h ô
const DOORS = [
  { type: 'h', c: 18, r: 14, w: 2 },   // giám đốc → sảnh
  { type: 'h', c: 22, r: 18, w: 2 },   // dev → sảnh
  { type: 'v', c: 14, r: 20, h: 2 },   // thư viện ↔ sảnh
  { type: 'v', c: 14, r: 31, h: 2 },   // pantry ↔ sảnh
  { type: 'v', c: 26, r: 27, h: 2 },   // phòng họp ↔ sảnh
  { type: 'h', c: 6,  r: 25, w: 2 },   // thư viện → pantry
];
const ENTRANCE = { c: 19, w: 2 };      // cửa chính ở cạnh dưới

// Kiểu sàn + tường cho từng phòng
const STYLE = {
  ceo:     { floor: 'planksH', f: ['#4d3527', '#553b2c'], seam: '#3a281d', fl: '#62452f',
             wall: { base: '#6e4a33', dark: '#553826', light: '#8a603f', panel: true } },
  dev:     { floor: 'tiles', f: ['#8d949d', '#959ca5'], seam: '#737a83', fl: '#a7aeb6',
             wall: { base: '#c9ced5', dark: '#a9afb8', light: '#dde1e6', panel: false } },
  library: { floor: 'planksV', f: ['#b07a4a', '#a67143'], seam: '#7f5432', fl: '#c08a58',
             wall: { base: '#9c6b43', dark: '#7d5232', light: '#b5835a', panel: true } },
  pantry:  { floor: 'planksV', f: ['#c08a55', '#b5804d'], seam: '#8a5c34', fl: '#cf9a64',
             wall: { base: '#eadfc8', dark: '#d2c4a8', light: '#f6eedd', panel: false } },
  meeting: { floor: 'planksV', f: ['#c7854a', '#bd7c43'], seam: '#8f5a2e', fl: '#d6955a',
             wall: { base: '#c9965f', dark: '#a87849', light: '#ddb07c', panel: true } },
  lobby:   { floor: 'marble', f: ['#3b3e46', '#40434c'], seam: '#2c2e35', fl: '#5a5e68',
             wall: { base: '#ddd4c4', dark: '#c0b6a4', light: '#ece5d8', panel: true } },
};

// =====================================================================
//  LƯỚI PHÒNG
// =====================================================================
const region = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
for (const [id, room] of Object.entries(ROOMS))
  for (const [c, r0, w, h] of room.rects)
    for (let y = r0; y < r0 + h; y++) for (let x = c; x < c + w; x++) region[y][x] = id;
const idAt = (x, y) => (x < 0 || y < 0 || x >= COLS || y >= ROWS ? null : region[y][x]);
const isFace = (x, y) => { const id = idAt(x, y); return id && (idAt(x, y - 1) !== id || idAt(x, y - 2) !== id); };
const px = (c) => OX + c * T;
const py = (r) => OY + r * T;

// =====================================================================
//  CÔNG CỤ VẼ
// =====================================================================
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const OL = '#1e1a24';
const box = (x, y, w, h, fill, ol = OL) => { r(x, y, w, h, ol); r(x + 1, y + 1, w - 2, h - 2, fill); };
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function disc(cx, cy, rx, ry, col) {
  for (let y = -ry; y <= ry; y++) {
    const w = Math.round(rx * Math.sqrt(1 - (y * y) / (ry * ry)));
    r(cx - w, cy + y, w * 2, 1, col);
  }
}
const lights = []; // nguồn sáng cho chế độ ban đêm: [x, y, bán kính, màu]

// ---------- Sàn ----------
function drawFloor(id, x, y, w, h) {
  const s = STYLE[id];
  const rnd = seeded(x * 7 + y * 13);
  if (s.floor === 'planksV') {
    for (let i = 0; i * 8 < w; i++) {
      const X = x + i * 8;
      r(X, y, 8, h, s.f[i % 2]); r(X, y, 1, h, s.seam);
      for (let Y = y + ((i * 29) % 44); Y < y + h; Y += 44) { r(X + 1, Y, 7, 1, s.seam); r(X + 1, Y + 1, 7, 1, s.fl); }
      for (let k = 0; k < h / 24; k++) r(X + 2 + (k % 4), y + rnd() * h, 1, 2, s.fl);
    }
  } else if (s.floor === 'planksH') {
    for (let i = 0; i * 6 < h; i++) {
      const Y = y + i * 6;
      r(x, Y, w, 6, s.f[i % 2]); r(x, Y, w, 1, s.seam);
      for (let X = x + ((i * 37) % 50); X < x + w; X += 50) { r(X, Y + 1, 1, 5, s.seam); r(X + 1, Y + 1, 1, 5, s.fl); }
      for (let k = 0; k < w / 30; k++) r(x + rnd() * w, Y + 2 + (k % 3), 2, 1, s.fl);
    }
  } else if (s.floor === 'tiles') {
    for (let Y = y; Y < y + h; Y += T) for (let X = x; X < x + w; X += T) {
      r(X, Y, T, T, s.f[((X - OX) / T + (Y - OY) / T) % 2]);
      r(X, Y, T, 1, s.fl); r(X, Y, 1, T, s.fl); r(X, Y + T - 1, T, 1, s.seam); r(X + T - 1, Y, 1, T, s.seam);
    }
  } else if (s.floor === 'marble') {
    for (let Y = y; Y < y + h; Y += 32) for (let X = x; X < x + w; X += 32) {
      r(X, Y, 32, 32, s.f[((X - OX) / 32 + (Y - OY) / 32) % 2]);
      r(X, Y, 32, 1, s.seam); r(X, Y, 1, 32, s.seam);
    }
    for (let v = 0; v < (w * h) / 900; v++) {   // vân đá
      let vx = x + rnd() * w, vy = y + rnd() * h;
      for (let k = 0; k < 18; k++) {
        r(Math.round(vx), Math.round(vy), 1, 1, s.fl);
        vx += rnd() * 2.4 - 0.6; vy += rnd() * 2 - 1;
        if (vx > x + w - 1 || vy > y + h - 1 || vy < y) break;
      }
    }
  }
}

// ---------- Tường sau (2 ô cao) ----------
function drawFaceColumn(id, x, y) {
  const s = STYLE[id].wall;
  r(x, y, T, 32, s.base);
  r(x, y, T, 3, s.dark);                 // bóng dưới mép trần
  r(x, y + 3, T, 1, s.light);
  if (s.panel) {                          // ốp gỗ / panel
    r(x + 2, y + 7, 12, 15, s.dark); r(x + 3, y + 8, 10, 13, s.base); r(x + 3, y + 8, 10, 1, s.light);
  } else {
    r(x, y + 21, T, 1, s.dark);           // nẹp tường
  }
  r(x, y + 25, T, 1, s.light);            // chân tường
  r(x, y + 26, T, 6, s.dark);
  r(x, y + 31, T, 1, OL);
}

// Ô cửa trên tường sau: nhìn xuyên sang phòng phía trên
function doorway(x, y, w, aboveId) {
  const f = STYLE[aboveId].f[0];
  r(x, y + 2, w, 30, '#2a222c');
  r(x + 2, y + 4, w - 4, 28, f);
  r(x + 2, y + 4, w - 4, 6, '#00000055');
  r(x, y + 2, 2, 30, '#7a5034'); r(x + w - 2, y + 2, 2, 30, '#7a5034'); r(x, y + 2, w, 2, '#7a5034');
}

// =====================================================================
//  ĐỒ VẬT
// =====================================================================
function plant(cx, by, big = false) {
  const s = big ? 1.3 : 1;
  box(cx - 5 * s, by - 9 * s, 10 * s, 9 * s, '#b4683e'); r(cx - 4 * s, by - 8 * s, 8 * s, 2, '#d0834f');
  const leaf = [['#2f7d3d', 0, -16, 7, 7], ['#3f9a4b', -7, -14, 6, 6], ['#3f9a4b', 7, -14, 6, 6], ['#4fb05a', -3, -21, 6, 7], ['#4fb05a', 4, -19, 5, 6]];
  for (const [c, dx, dy, rx, ry] of leaf) disc(cx + dx * s, by + dy * s, rx * s, ry * s, OL);
  for (const [c, dx, dy, rx, ry] of leaf) disc(cx + dx * s, by + dy * s, rx * s - 1, ry * s - 1, c);
  r(cx - 3 * s, by - 21 * s, 2, 2, '#7ad686'); r(cx + 5 * s, by - 16 * s, 2, 2, '#7ad686');
}
function frame(x, y, w, h, inner) {
  box(x, y, w, h, '#c9a24a'); r(x + 2, y + 2, w - 4, h - 4, inner);
}
function sconce(x, y, glow) {
  box(x - 3, y, 6, 7, '#d8b45a'); r(x - 2, y + 1, 4, 3, glow);
  lights.push([x, y + 3, 26, glow]);
}
function monitor(x, y, w = 14, screen = '#4fa3e0') {
  box(x, y, w, 10, '#23262e'); r(x + 2, y + 2, w - 4, 6, screen);
  r(x + 3, y + 3, w - 8, 1, '#ffffff99'); r(x + 3, y + 5, w - 10, 1, '#ffffff66');
  r(x + w / 2 - 1, y + 10, 2, 2, '#23262e'); r(x + w / 2 - 3, y + 12, 6, 1, '#23262e');
  lights.push([x + w / 2, y + 5, 18, screen]);
}
// ghế văn phòng: 'up' = quay lưng về camera, 'down' = quay mặt về camera
function officeChair(cx, by, col, dir = 'up') {
  const d = shade(col, -0.3);
  if (dir === 'up') {
    box(cx - 6, by - 12, 12, 7, col); r(cx - 5, by - 11, 10, 1, shade(col, 0.25));
    box(cx - 5, by - 6, 10, 4, d);
  } else {
    box(cx - 6, by - 14, 12, 5, d);
    box(cx - 6, by - 10, 12, 7, col); r(cx - 5, by - 9, 10, 1, shade(col, 0.25));
  }
  r(cx - 1, by - 3, 2, 2, '#2a2a33'); r(cx - 5, by - 1, 10, 1, '#2a2a33');
}
function armchair(x, y, col, dir) {           // x,y góc trên trái, 22x20
  const d = shade(col, -0.3), l = shade(col, 0.2);
  if (dir === 'right' || dir === 'left') {
    const back = dir === 'right' ? x : x + 14;
    box(x, y, 22, 20, d);
    box(back, y, 8, 20, col);
    box(x + (dir === 'right' ? 7 : 1), y + 4, 14, 12, l);
    r(x + 1, y + 1, 20, 3, col); r(x + 1, y + 16, 20, 3, col);
  } else {
    box(x, y, 22, 20, d);
    box(x, dir === 'down' ? y : y + 12, 22, 8, col);
    box(x + 4, dir === 'down' ? y + 7 : y + 2, 14, 11, l);
    r(x + 1, y + 1, 3, 18, col); r(x + 18, y + 1, 3, 18, col);
  }
}
function sofa(x, y, w, col, dir = 'down') {   // dir = hướng người ngồi nhìn
  const d = shade(col, -0.3), l = shade(col, 0.18);
  if (dir === 'right') {
    box(x, y, 20, w, d); box(x, y, 8, w, col);
    for (let i = 0; i < w - 8; i += 14) box(x + 7, y + 4 + i, 12, 13, l);
    box(x, y, 20, 5, col); box(x, y + w - 5, 20, 5, col);
  } else {
    const backY = dir === 'down' ? y : y + 12;
    box(x, y, w, 20, d); box(x, backY, w, 8, col);
    for (let i = 0; i < w - 8; i += 14) box(x + 4 + i, dir === 'down' ? y + 7 : y + 1, 13, 12, l);
    box(x, y, 5, 20, col); box(x + w - 5, y, 5, 20, col);
  }
}
function rug(x, y, w, h, base, border, accent) {
  box(x, y, w, h, border);
  r(x + 3, y + 3, w - 6, h - 6, base);
  r(x + 5, y + 5, w - 10, 1, accent); r(x + 5, y + h - 6, w - 10, 1, accent);
  r(x + 5, y + 5, 1, h - 10, accent); r(x + w - 6, y + 5, 1, h - 10, accent);
  for (let i = 10; i < w - 10; i += 12) for (let j = 10; j < h - 10; j += 12) {
    r(x + i, y + j, 2, 2, accent); r(x + i + 6, y + j + 6, 1, 1, border);
  }
}
function bookshelf(x, y, w, h) {
  box(x, y, w, h, '#5a3a24');
  const cols = ['#c0392b', '#2e6fb5', '#e0b23c', '#2f9a5c', '#8e4fae', '#d36b2a', '#e8e2d6', '#1f9c8a'];
  const rnd = seeded(x + y);
  for (let sy = y + 3; sy < y + h - 6; sy += 10) {
    r(x + 2, sy, w - 4, 8, '#2e1e13');
    for (let bx = x + 3; bx < x + w - 4;) {
      const bw = 2 + (rnd() > 0.6 ? 1 : 0), bh = 5 + ((rnd() * 3) | 0);
      r(bx, sy + 8 - bh, bw, bh, cols[(rnd() * cols.length) | 0]);
      bx += bw + (rnd() > 0.8 ? 1 : 0);
    }
    r(x + 1, sy + 8, w - 2, 2, '#7a5034');
  }
}
function cabinetGlass(x, y, w, h) {
  box(x, y, w, h, '#5c3b25');
  for (let sy = y + 3; sy < y + h - 12; sy += 11) {
    r(x + 3, sy, w - 6, 9, '#9fc4d6'); r(x + 4, sy + 1, 2, 7, '#d5ecf5');
    r(x + w / 2 - 2, sy + 4, 4, 5, '#d9b44a'); r(x + w / 2 - 1, sy + 2, 2, 2, '#d9b44a');
  }
  r(x + 2, y + h - 10, w - 4, 8, '#4a2f1d'); r(x + w / 2 - 1, y + h - 7, 2, 2, '#d9b44a');
}
function desk(x, y, w, h, top, front, edge) {
  r(x + 2, y + h, 2, 5, front); r(x + w - 4, y + h, 2, 5, front);
  box(x, y + h - 2, w, 6, front);
  box(x, y, w, h, top);
  r(x + 1, y + 1, w - 2, 1, edge);
}
function whiteboard(x, y, w, h) {
  box(x, y, w, h, '#f5f5f2', '#6b6f78');
  r(x + 4, y + 4, 14, 1, '#2e6fb5'); r(x + 4, y + 7, 10, 1, '#2e6fb5');
  for (let i = 0; i < 4; i++) r(x + 24 + i * 6, y + h - 4 - (i + 1) * 3, 4, (i + 1) * 3, ['#e05a4a', '#e0b23c', '#2f9a5c', '#2e6fb5'][i]);
  r(x + w - 30, y + 5, 22, 1, '#555'); r(x + w - 30, y + 9, 16, 1, '#555'); r(x + w - 30, y + 13, 19, 1, '#555');
  r(x + 6, y + h, w - 12, 2, '#8a8f99');
}
function tv(x, y, w, h, kind) {
  box(x, y, w, h, '#1d2027');
  r(x + 2, y + 2, w - 4, h - 4, kind === 'map' ? '#1f4f6e' : '#162232');
  if (kind === 'map') {
    disc(x + w * 0.3, y + h * 0.45, 5, 3, '#3fa36b'); disc(x + w * 0.6, y + h * 0.4, 7, 4, '#3fa36b'); disc(x + w * 0.7, y + h * 0.7, 3, 2, '#3fa36b');
  } else if (kind === 'chart') {
    for (let i = 0; i < 5; i++) r(x + 4 + i * 5, y + h - 4 - (i % 3 + 1) * 3, 3, (i % 3 + 1) * 3, ['#ff6fa8', '#6fd3ff', '#ffd166'][i % 3]);
    r(x + w - 18, y + 4, 14, 1, '#9fb4cc'); r(x + w - 18, y + 7, 10, 1, '#9fb4cc');
  } else {
    for (let i = 0; i < (h - 6) / 2; i++) r(x + 4 + (i % 3) * 2, y + 3 + i * 2, 6 + ((i * 7) % (w - 14)), 1, ['#50fa7b', '#8be9fd', '#f1fa8c', '#ff79c6'][i % 4]);
  }
  lights.push([x + w / 2, y + h / 2, w * 0.8, kind === 'code' ? '#50fa7b' : '#6fd3ff']);
}
function server(x, y) {
  box(x, y, 14, 28, '#23262e');
  for (let i = 0; i < 5; i++) {
    r(x + 2, y + 2 + i * 5, 10, 4, '#3a3f4c');
    r(x + 3, y + 4 + i * 5, 1, 1, i % 2 ? '#50fa7b' : '#ffb86c'); r(x + 5, y + 4 + i * 5, 1, 1, '#6fd3ff');
  }
  lights.push([x + 7, y + 14, 14, '#50fa7b']);
}
function locker(x, y, w, h) {
  box(x, y, w, h, '#8a919c');
  for (let i = 0; i < h - 4; i += 9) { r(x + 2, y + 2 + i, w - 4, 7, '#a3aab4'); r(x + w / 2 - 2, y + 5 + i, 4, 1, '#5f6670'); }
}
function waterCooler(x, y) {
  box(x + 2, y, 10, 11, '#7fc4ff'); r(x + 4, y + 2, 2, 7, '#c4e6ff');
  box(x, y + 10, 14, 16, '#e6ebf0'); r(x + 3, y + 14, 2, 2, '#3498db'); r(x + 9, y + 14, 2, 2, '#e74c3c');
}
function stool(cx, by) { disc(cx, by - 5, 5, 3, OL); disc(cx, by - 5, 4, 2, '#3a3f4c'); r(cx - 1, by - 3, 2, 3, '#555'); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1, 7), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => f(v).toString(16).padStart(2, '0')).join('');
}

// =====================================================================
//  NỘI THẤT TỪNG PHÒNG
// =====================================================================
function furnishCEO() {
  // tường: bằng khen, tranh thành phố, đèn tường
  frame(px(1) + 2, py(0) + 9, 12, 14, '#e8e0cc'); frame(px(3) + 2, py(0) + 9, 12, 14, '#e8e0cc');
  r(px(1) + 6, py(0) + 13, 4, 1, '#888'); r(px(3) + 6, py(0) + 13, 4, 1, '#888');
  sconce(px(5) + 8, py(0) + 8, '#ffd27a');

// =====================================================================
//  VẼ TOÀN BỘ
// =====================================================================
let night = false;

function draw() {
  lights.length = 0;
  r(0, 0, W, H, '#1b1820');

  // 1) sàn
  for (const [id, room] of Object.entries(ROOMS))
    for (const [c, r0, w, h] of room.rects) drawFloor(id, px(c), py(r0), w * T, h * T);

  // 2) tường sau
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const id = idAt(x, y);
    if (id && isFace(x, y) && idAt(x, y - 1) !== id) drawFaceColumn(id, px(x), py(y));
  }
  // bóng đổ dưới tường sau
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const id = idAt(x, y);
    if (id && !isFace(x, y) && isFace(x, y - 1)) { r(px(x), py(y), T, 4, '#00000040'); r(px(x), py(y) + 4, T, 2, '#00000020'); }
  }
  // ô cửa trên tường sau
  for (const d of DOORS) if (d.type === 'h') doorway(px(d.c), py(d.r), d.w * T, idAt(d.c, d.r - 1));

  // 3) đồ vật
  furnishCEO(); furnishDev(); furnishLibrary(); furnishPantry(); furnishMeeting(); furnishLobby();

  // 4) mép tường giữa các phòng
  drawWalls();

  // 5) ban đêm
  if (night) drawNight();
}

function isDoorEdge(type, x, y) {
  return DOORS.some((d) =>
    d.type === type && (type === 'h' ? y === d.r && x >= d.c && x < d.c + d.w : x === d.c && y >= d.r && y < d.r + d.h));
}

function drawWalls() {
  const CAP = '#ece7df', CAPD = '#bdb6aa';
  const seg = (x, y, w, h) => { r(x - 1, y - 1, w + 2, h + 2, OL); r(x, y, w, h, CAP); r(x, y + h - 1, w, 1, CAPD); };
  // tường ngăn dọc
  for (let y = 0; y < ROWS; y++) for (let x = 1; x < COLS; x++)
    if (idAt(x - 1, y) !== idAt(x, y) && !isDoorEdge('v', x, y)) seg(px(x) - 2, py(y) - (isFace(x, y) || isFace(x - 1, y) ? 0 : 2), 4, T + 2);
  // tường ngăn ngang
  for (let y = 1; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (idAt(x, y - 1) !== idAt(x, y) && !isDoorEdge('h', x, y)) seg(px(x) - 1, py(y) - 3, T + 2, 4);
  // khung ngoài toà nhà
  const OUT = '#2e2f3a', OUTL = '#4a4c5c';
  r(0, 0, W, OY, OUT); r(0, 0, OX, OY + ROWS * T + OY, OUT); r(W - OX, 0, OX, OY + ROWS * T + OY, OUT);
  r(0, OY + ROWS * T, px(ENTRANCE.c), OY, OUT); r(px(ENTRANCE.c + ENTRANCE.w), OY + ROWS * T, W - px(ENTRANCE.c + ENTRANCE.w), OY, OUT);
  r(OX - 2, OY - 2, ROWS * T + 4, 2, OUTL); r(OX - 2, OY - 2, 2, ROWS * T + 4, OUTL); r(W - OX, OY - 2, 2, ROWS * T + 4, OUTL);
  r(OX - 2, OY + ROWS * T, px(ENTRANCE.c) - OX + 2, 2, OUTL); r(px(ENTRANCE.c + ENTRANCE.w), OY + ROWS * T, W - OX - px(ENTRANCE.c + ENTRANCE.w) + 2, 2, OUTL);
  r(0, 0, W, 2, '#c9a24a'); r(0, 0, 2, OY + ROWS * T + OY, '#c9a24a'); r(W - 2, 0, 2, OY + ROWS * T + OY, '#c9a24a');
  // cửa chính + thảm
  const ex = px(ENTRANCE.c), ew = ENTRANCE.w * T, ey = OY + ROWS * T;
  r(ex, ey, ew, OY, '#3b3e46');
  box(ex + 4, ey + OY, ew - 8, 12, '#4f7a3a'); r(ex + 8, ey + OY + 3, ew - 16, 6, '#5f8f46');
  box(ex - 4, ey - 4, 5, OY + 6, '#4a4c5c'); box(ex + ew - 1, ey - 4, 5, OY + 6, '#4a4c5c');
}

function drawNight() {
  g.save();
  g.globalCompositeOperation = 'multiply';
  r(OX, OY, COLS * T, ROWS * T, '#3a3d78');
  g.globalCompositeOperation = 'lighter';
  for (const [x, y, rad, col] of lights) {
    const grd = g.createRadialGradient(x, y, 1, x, y, rad);
    grd.addColorStop(0, col + '66'); grd.addColorStop(1, col + '00');
    g.fillStyle = grd; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.restore();
}

// =====================================================================
//  ZOOM, KÉO, LƯỚI, TÊN PHÒNG
// =====================================================================
const stage = document.getElementById('stage');
const wrap = document.getElementById('wrap');
const ov = document.getElementById('ov');
const og = ov.getContext('2d');
const labels = document.getElementById('labels');
let zoomMode = 'fit', scale = 1, showGrid = false;

function applyZoom() {
  const b = stage.getBoundingClientRect();
  scale = zoomMode === 'fit' ? Math.min((b.width - 8) / W, (b.height - 8) / H) : Number(zoomMode);
  const w = Math.floor(W * scale), h = Math.floor(H * scale);
  for (const el of [cv, ov]) { el.style.width = w + 'px'; el.style.height = h + 'px'; }
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  wrap.style.marginTop = Math.max(0, (b.height - h) / 2) + 'px';
  ov.width = w; ov.height = h;
  drawOverlay();
  labels.innerHTML = '';
  for (const room of Object.values(ROOMS)) {
    const [c, r0, w2, h2] = room.rects[room.rects.length - 1];
    const el = document.createElement('div');
    el.className = 'label';
    el.textContent = room.name;
    el.style.left = (px(c) + (w2 * T) / 2) * scale + 'px';
    el.style.top = (py(r0) + (h2 * T) / 2) * scale + 'px';
    labels.appendChild(el);
  }
}

function drawOverlay() {
  og.clearRect(0, 0, ov.width, ov.height);
  if (!showGrid) return;
  og.strokeStyle = 'rgba(255,255,255,0.22)';
  og.beginPath();
  for (let c = 0; c <= COLS; c++) { const x = Math.round(px(c) * scale) + 0.5; og.moveTo(x, py(0) * scale); og.lineTo(x, py(ROWS) * scale); }
  for (let rr = 0; rr <= ROWS; rr++) { const y = Math.round(py(rr) * scale) + 0.5; og.moveTo(px(0) * scale, y); og.lineTo(px(COLS) * scale, y); }
  og.stroke();
  if (scale >= 1.8) {
    og.fillStyle = 'rgba(255,255,255,0.5)';
    og.font = `${Math.floor(scale * 3.2)}px monospace`;
    for (let rr = 0; rr < ROWS; rr++) for (let c = 0; c < COLS; c++) og.fillText(`${c},${rr}`, px(c) * scale + 2, py(rr) * scale + scale * 4);
  }
}

// kéo để di chuyển khi phóng to
let drag = null;
stage.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, sl: stage.scrollLeft, st: stage.scrollTop }; stage.classList.add('drag'); });
window.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
const tip = document.getElementById('tip');
stage.addEventListener('pointermove', (e) => {
  if (drag) { stage.scrollLeft = drag.sl - (e.clientX - drag.x); stage.scrollTop = drag.st - (e.clientY - drag.y); }
  const b = cv.getBoundingClientRect();
  const c = Math.floor(((e.clientX - b.left) / scale - OX) / T);
  const rr = Math.floor(((e.clientY - b.top) / scale - OY) / T);
  const id = idAt(c, rr);
  if (!id) { tip.style.display = 'none'; return; }
  tip.textContent = `${ROOMS[id].name} · ô (${c}, ${rr})${isFace(c, rr) ? ' · tường' : ''}`;
  tip.style.display = 'block';
  tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px';
});
stage.addEventListener('pointerleave', () => (tip.style.display = 'none'));

document.querySelectorAll('[data-zoom]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-zoom]').forEach((x) => x.classList.remove('on'));
  b.classList.add('on'); zoomMode = b.dataset.zoom; applyZoom();
}));
document.getElementById('btn-labels').addEventListener('click', (e) => { e.target.classList.toggle('on'); labels.classList.toggle('hidden'); });
document.getElementById('btn-grid').addEventListener('click', (e) => { showGrid = !showGrid; e.target.classList.toggle('on', showGrid); drawOverlay(); });
document.getElementById('btn-night').addEventListener('click', (e) => { night = !night; e.target.classList.toggle('on', night); draw(); });
document.getElementById('btn-png').addEventListener('click', () => {
  const out = document.createElement('canvas');
  out.width = W * 3; out.height = H * 3;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(cv, 0, 0, out.width, out.height);
  const a = document.createElement('a'); a.download = 'van-phong.png'; a.href = out.toDataURL('image/png'); a.click();
});
window.addEventListener('resize', applyZoom);

draw();
applyZoom();
</script>
