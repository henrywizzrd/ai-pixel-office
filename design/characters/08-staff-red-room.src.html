<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhân viên mới trong phòng đỏ · Phòng dày dặn · sàn đỏ + nhân vật kiểu Habbo</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #dbb378; font-family: ui-monospace, Consolas, monospace; color: #24120c; display: flex; flex-direction: column; align-items: center; }
  body.night { background: #1d1410; color: #dbb378; }
  .bar { display: flex; gap: 6px; padding: 10px; }
  button { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 4px; cursor: pointer; background: #f4efe6; color: #24120c; border: 2px solid #24120c; }
  button.on { background: #24120c; color: #f4efe6; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
  <div class="bar"><button id="btn-night">Ban đêm</button><button id="btn-png">Tải PNG</button></div>
  <div id="stage"><canvas id="cv"></canvas></div>
<script src="../lib/iso-engine.js"></script>
<script src="../lib/items.js"></script>
<script src="../lib/items-2.js"></script>
<script src="../lib/rooms.js"></script>
<script src="../lib/staff-sprite.js"></script>
<script>
const RX = 128, RY = 120, WH = 84, W = 330, H = 290;
const item = (id) => ITEMS.find((i) => i.id === id);
const v = (id, name) => item(id).variants.find((x) => x.name === name) || item(id).variants[0];

function scene(iso) {
  Rooms.thickRoom(iso, RX, RY, WH, 'red');
  item('big-plant').draw(iso.at('R', 2, 2), iso, v('big-plant', 'Cây bụi'));
  item('sofa-2').draw(iso.at('R', 24, 1), iso, v('sofa-2', 'Vải xám'));
  item('workstation').draw(iso.at('L', 26, 1), iso, v('workstation', 'Bàn nâu đỏ · màn đen'));
  const D2 = 72;
  item('desk').draw(iso.at('L', D2, 1), iso, v('desk', 'Gỗ nâu đỏ'));
  item('monitor').draw(iso.at('L', D2 + 1, 2), iso, v('monitor', 'Code'), 24);
  item('keyboard').draw(iso.at('L', D2 + 1, 15), iso, v('keyboard', 'Kem'), 24);
  item('laptop').draw(iso.at('L', D2 + 24, 9), iso, v('laptop', 'Bạc'), 24);
  // nhân viên mới (sprite ASCII từ design/sprites/staff_rpg.py), chân đặt tại ô sàn (x, y)
  const S = window.STAFF_SPRITE;
  for (const [x, y] of [[46, 66], [86, 60]]) {
    const [fx, fy] = iso.proj(x, y, 0);
    iso.blob(fx, fy, 6, 2, '#2a1418'); iso.commit(null, 0.3);
    const ox = fx - 9, oy = fy - S.rows.length + 1;
    S.rows.forEach((row, j) => [...row].forEach((ch, i) => ch !== '.' && iso.put(ox + i, oy + j, S.pal[ch])));
    iso.commit(null);
  }
}

let night = false;
const cv = document.getElementById('cv');
function render() {
  const iso = Iso.createIso(W, H, { ox: RY + (W - RX - RY) / 2 + 2, oy: WH + 34, bg: '#dbb378' });
  iso.S.night = night; iso.clear(); scene(iso); iso.finish(cv);
  document.body.classList.toggle('night', night); fit();
}
function fit() { const st = document.getElementById('stage').getBoundingClientRect(); const s = Math.max(1, Math.floor(Math.min(st.width / W, st.height / H))); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
document.getElementById('btn-night').onclick = (e) => { night = !night; e.target.classList.toggle('on', night); render(); };
document.getElementById('btn-png').onclick = () => { const o = document.createElement('canvas'); o.width = W * 4; o.height = H * 4; const g = o.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(cv, 0, 0, o.width, o.height); const a = document.createElement('a'); a.download = 'phong-day-dan.png'; a.href = o.toDataURL(); a.click(); };
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
