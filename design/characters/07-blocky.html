<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhân vật khối vuông (kiểu Steve) · thử trên nền văn phòng</title>
<style>
  html, body { margin: 0; }
  body { background: #2c2c3c; font-family: ui-monospace, Consolas, monospace; color: #ebe4f2; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 12px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  h3 { margin: 6px 0 0; font-size: 13px; font-weight: normal; opacity: .8; }
</style>
</head>
<body>
  <h3>Bảng sprite 16×32 · xuống / lên / ngang · đứng / bước A / bước B</h3>
  <canvas id="sheet"></canvas>
  <h3>Đi lại trên nền văn phòng</h3>
  <div class="bar">Nền: <input type="file" id="file" accept="image/*" /> (chọn Office_Design_1.gif / png nếu chưa hiện)</div>
  <canvas id="cv"></canvas>
<script>
// =====================================================================
//  ISO PIXEL ENGINE — dùng chung cho catalog và các phòng
//
//  Toạ độ thế giới (x, y, z), đơn vị pixel. Chiếu isometric 2:1:
//     sx = ox + x - y        sy = oy + (x + y) / 2 - z
//  Mặt "left" (y = y1) có độ sáng trung bình, mặt "right" (x = x1) tối nhất,
//  mặt trên sáng nhất. Ánh sáng chiếu từ trên, lệch trái.
//
//  Đồ vật được vẽ theo toạ độ cục bộ (u, v, z):
//     u = dọc theo bức tường mà đồ vật dựa vào
//     v = hướng ra xa tường (về phía người xem)
//  Hướng 'R' = dựa tường phải (mặt phẳng y = 0), 'L' = dựa tường trái (x = 0).
//  Hướng L chính là ảnh soi gương của hướng R.
// =====================================================================
(function (global) {
  const P = {
    ink: '#372240', plum1: '#4c2d54', plum2: '#513359', plum3: '#6b4870', plum4: '#8f5d82',
    mag0: '#520440', mag1: '#75125e', mag2: '#943672', mag3: '#a13f7d', mag4: '#c24c7d',
    cor1: '#c65b69', cor2: '#cb5f72', cor3: '#da6f75', cor4: '#eb8379',
    pk1: '#ebaaa2', pk2: '#ebb9b2', peach: '#fcaf7e', peach2: '#fcaf92', sand: '#fad1a9',
    cream1: '#f7dcd0', cream2: '#fcf2e3', white: '#fffbf5',
    mustard: '#e4d176', mustD: '#b8a24a', mint: '#6fd6a5', mint2: '#3fae8a', mint3: '#2f7f6e', lime: '#d4eda9',
    brown: '#7a3b2a', sky: '#bfe3f0',
  };

  const rgbCache = new Map();
  function rgb(hex) {
    if (!rgbCache.has(hex)) {
      const n = parseInt(hex.slice(1, 7), 16);
      rgbCache.set(hex, [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
    }
    return rgbCache.get(hex);
  }

  // Khối vật liệu: màu mặt trên / mặt sáng vừa / mặt tối + viền sáng cạnh trước
  // round = true: cắt 1px ở góc để khối trông bo tròn mềm
  function mat(top, mid, dark, rim, round = false) {
    return {
      top: (u, v, w, d) => {
        if (round && (u === 0 || u === w - 1) && (v === 0 || v === d - 1)) return null;
        return rim && (u >= w - 1 || v >= d - 1) ? rim : top;
      },
      front: (u, z, w, h, sh) => (round && z === h - 1 && (u === 0 || u === w - 1) ? null : sh ? dark : mid),
      side: (v, z, d, h, sh) => (round && z === h - 1 && (v === 0 || v === d - 1) ? null : sh ? dark : mid),
    };
  }

  function createIso(W, H, { ox, oy, bg = P.sand } = {}) {
    const main = new Uint8ClampedArray(W * H * 4);
    const emissive = new Uint8Array(W * H);
    const layer = new Int32Array(W * H).fill(-1);
    const layerEm = new Uint8Array(W * H);
    let touched = [];
    const colors = [];
    const colorIdx = new Map();
    const glows = [];
    const ci = (hex) => {
      if (!colorIdx.has(hex)) { colorIdx.set(hex, colors.length); colors.push(rgb(hex)); }
      return colorIdx.get(hex);
    };
    const S = { night: false, bg };

    function clear() {
      const clearA = S.bg === 'transparent' ? 0 : 255;
      const c = clearA ? rgb(S.night ? '#2a1c34' : S.bg) : [0, 0, 0];
      for (let i = 0; i < W * H; i++) {
        main[i * 4] = c[0]; main[i * 4 + 1] = c[1]; main[i * 4 + 2] = c[2]; main[i * 4 + 3] = clearA;
        emissive[i] = 1;
      }
      glows.length = 0;
    }

    function put(px, py, hex, em = false) {
      px = Math.round(px); py = Math.round(py);
      if (px < 0 || py < 0 || px >= W || py >= H || !hex) return;
      const i = py * W + px;
      if (layer[i] === -1) touched.push(i);
      layer[i] = ci(hex);
      layerEm[i] = em ? 1 : 0;
    }

    function box(b, st) {
      const { x0, x1, y0, y1, z0, z1 } = b;
      const em = !!st.emissive;
      const sxMin = Math.floor(ox + x0 - y1) - 1, sxMax = Math.ceil(ox + x1 - y0) + 1;
      const syMin = Math.floor(oy + (x0 + y0) / 2 - z1) - 1, syMax = Math.ceil(oy + (x1 + y1) / 2 - z0) + 1;
      for (let py = Math.max(0, syMin); py <= Math.min(H - 1, syMax); py++)
        for (let px = Math.max(0, sxMin); px <= Math.min(W - 1, sxMax); px++) {
          const u = px + 0.5 - ox, vy = py + 0.5 - oy;
          if (st.top) {
            const v = 2 * (vy + z1);
            const x = (u + v) / 2, y = (v - u) / 2;
            if (x >= x0 && x < x1 && y >= y0 && y < y1) {
              const c = st.top(Math.floor(x - x0), Math.floor(y - y0), x1 - x0, y1 - y0);
              if (c) { put(px, py, c, em && st.emTop !== false); continue; }
            }
          }
          if (st.left) {
            const x = u + y1, z = (x + y1) / 2 - vy;
            if (x >= x0 && x < x1 && z >= z0 && z < z1) {
              const c = st.left(Math.floor(x - x0), Math.floor(z - z0), x1 - x0, z1 - z0);
              if (c) { put(px, py, c, em); continue; }
            }
          }
          if (st.right) {
            const y = x1 - u, z = (x1 + y) / 2 - vy;
            if (y >= y0 && y < y1 && z >= z0 && z < z1) {
              const c = st.right(Math.floor(y - y0), Math.floor(z - z0), y1 - y0, z1 - z0);
              if (c) put(px, py, c, em);
            }
          }
        }
    }

    const proj = (x, y, z) => [Math.round(ox + x - y), Math.round(oy + (x + y) / 2 - z)];

    function blob(cx, cy, rx, ry, hex, em = false) {
      for (let y = -ry; y <= ry; y++)
        for (let x = -rx; x <= rx; x++)
          if ((x * x) / (rx * rx + 0.6) + (y * y) / (ry * ry + 0.6) <= 1) put(cx + x, cy + y, hex, em);
    }

    // Đẩy lớp tạm xuống ảnh chính, viền 1px phía trong bằng màu outline
    function commit(outline = P.ink, alpha = 1) {
      if (outline && S.olMap && S.olMap[outline]) outline = S.olMap[outline];
      const oc = outline ? ci(outline) : -1;
      for (const i of touched) {
        let c = layer[i];
        if (oc >= 0 && !layerEm[i]) {
          const x = i % W;
          if (x === 0 || x === W - 1 || layer[i - 1] === -1 || layer[i + 1] === -1 || layer[i - W] === -1 || layer[i + W] === -1) c = oc;
        }
        const [r, g, b] = colors[c];
        const k = i * 4;
        if (alpha >= 1) { main[k] = r; main[k + 1] = g; main[k + 2] = b; main[k + 3] = 255; emissive[i] = layerEm[i]; }
        else if (main[k + 3] === 0) { main[k] = r; main[k + 1] = g; main[k + 2] = b; main[k + 3] = Math.round(alpha * 255); }
        else { main[k] += (r - main[k]) * alpha; main[k + 1] += (g - main[k + 1]) * alpha; main[k + 2] += (b - main[k + 2]) * alpha; }
      }
      for (const i of touched) { layer[i] = -1; layerEm[i] = 0; }
      touched = [];
    }

    const glow = (x, y, rad, hex, a = 0.5) => glows.push([x, y, rad, hex, a]);

    // Đặt đồ vật: trả về bộ vẽ theo toạ độ cục bộ (u, v, z)
    function at(dir, U, V) {
      const R = dir !== 'L';
      return {
        dir: R ? 'R' : 'L',
        box(lb, st) {
          const { u0, u1, v0, v1, z0, z1 } = lb;
          if (R)
            box({ x0: U + u0, x1: U + u1, y0: V + v0, y1: V + v1, z0, z1 }, {
              top: st.top, emissive: st.emissive, emTop: st.emTop,
              left: st.front && ((x, z, w, h) => st.front(x, z, w, h, 0)),
              right: st.side && ((y, z, d, h) => st.side(y, z, d, h, 1)),
            });
          else
            box({ x0: V + v0, x1: V + v1, y0: U + u0, y1: U + u1, z0, z1 }, {
              top: st.top && ((x, y, w, d) => st.top(y, x, d, w)), emissive: st.emissive, emTop: st.emTop,
              right: st.front && ((y, z, d, h) => st.front(d - 1 - y, z, d, h, 1)),
              left: st.side && ((x, z, w, h) => st.side(x, z, w, h, 0)),
            });
        },
        p(u, v, z) { return R ? proj(U + u, V + v, z) : proj(V + v, U + u, z); },
        // hướng ngang trên màn hình khi u tăng: +1 với R, -1 với L
        get sgn() { return R ? 1 : -1; },
      };
    }

    // Kết xuất ra canvas (ban đêm: tối dần trừ pixel phát sáng, cộng quầng sáng)
    function finish(canvas) {
      if (S.night) {
        const tint = rgb('#5a4a8c');
        for (let i = 0; i < W * H; i++) {
          if (emissive[i]) continue;
          const k = i * 4;
          main[k] = (main[k] * tint[0]) / 255; main[k + 1] = (main[k + 1] * tint[1]) / 255; main[k + 2] = (main[k + 2] * tint[2]) / 255;
        }
        for (const [gx, gy, rad, hex, a] of glows) {
          const [r, g, b] = rgb(hex);
          for (let y = -rad; y <= rad; y++)
            for (let x = -rad; x <= rad; x++) {
              const d = Math.sqrt(x * x + y * y) / rad;
              if (d > 1) continue;
              const px = gx + x, py = gy + y;
              if (px < 0 || py < 0 || px >= W || py >= H) continue;
              const s = a * (d < 0.35 ? 0.6 : d < 0.7 ? 0.35 : 0.15);
              const k = (py * W + px) * 4;
              main[k] = Math.min(255, main[k] + r * s); main[k + 1] = Math.min(255, main[k + 1] + g * s); main[k + 2] = Math.min(255, main[k + 2] + b * s);
            }
        }
      }
      canvas.width = W; canvas.height = H;
      canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(main), W, H), 0, 0);
    }

    return {
      W, H, P, S, clear, put, box, blob, commit, proj, glow, at, finish,
      get night() { return S.night; },
    };
  }

  // Phòng nhỏ (góc 2 tường + sàn) để bày đồ vật trong catalog hoặc làm phòng thật
  function cornerRoom(iso, RX, RY, WH, theme = {}) {
    const { P } = iso;
    const T = {
      wallL: P.cream2, wallLlow: P.cream1, wallLline: P.pk1,
      wallR: P.plum3, wallRlow: P.plum2, wallRline: P.plum1,
      floorA: P.cor4, floorB: '#e57d77', seam: P.cor2, ...theme,
    };
    iso.box({ x0: -4, x1: 0, y0: -4, y1: RY, z0: -6, z1: WH }, {
      top: () => P.white,
      left: () => P.pk2,
      right: (y, z) => (z < 2 ? P.pk1 : z < 16 ? (z === 15 ? P.white : y % 12 === 0 ? T.wallLline : T.wallLlow) : z < 18 ? P.pk2 : T.wallL),
    });
    iso.commit(P.mag1);
    iso.box({ x0: 0, x1: RX, y0: -4, y1: 0, z0: -6, z1: WH }, {
      top: () => P.white,
      left: (x, z) => (z < 2 ? P.ink : z < 16 ? (z === 15 ? P.plum4 : x % 12 === 0 ? T.wallRline : T.wallRlow) : z < 18 ? P.plum4 : T.wallR),
      right: () => P.plum4,
    });
    iso.commit(P.ink);
    iso.box({ x0: 0, x1: RX, y0: 0, y1: RY, z0: -6, z1: 0 }, {
      top: (x, y) => {
        const row = Math.floor(y / 9);
        if (y % 9 === 0) return T.seam;
        if ((x + 56 - ((row * 37) % 56)) % 56 === 0) return T.seam;
        if (x < 3 || y < 3) return P.cor3;
        return row % 2 ? T.floorA : T.floorB;
      },
      left: (x, z) => (z === 5 ? P.cor2 : P.mag3),
      right: (y, z) => (z === 5 ? P.mag3 : P.mag2),
    });
    iso.commit(P.mag0);
  }

  global.Iso = { createIso, mat, cornerRoom, P, rgb };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// =====================================================================
//  NHÂN VẬT KHỐI VUÔNG KIỂU STEVE (Minecraft) — 16 × 32 px (chuẩn 1×2 ô 16px)
//  Đầu là khối 10×10 (mặt 8×8 đúng kiểu Steve) · thân 10×11 · tay 4 · chân 5.
//  Mỗi khối có viền riêng như hộp Minecraft, tô phẳng + mép sáng trên + cạnh tối phải.
//  Hướng: down / up / right (left = lật gương). Khung: idle | a | b.
//  Góc neo (fx, fy) = điểm giữa bàn chân.
// =====================================================================
(function (global) {
  const OL = '#393950';

  function shadeHex(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k))));
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => f(v).toString(16).padStart(2, '0')).join('');
  }

  function painter(iso, fx, fy, flip) {
    const ox = fx - 8, oy = fy - 31;
    const P = (x, y, c) => c && iso.put(flip ? ox + 15 - x : ox + x, oy + y, c);
    const R = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) P(x + i, y + j, c); };
    const box = (x, y, w, h, c, { top = true, dark = 1 } = {}) => {
      R(x, y, w, h, OL);
      R(x + 1, y + 1, w - 2, h - 2, c);
      if (dark && w > 3) R(x + w - 1 - dark, y + 1, dark, h - 2, shadeHex(c, -0.2));
      if (top) R(x + 1, y + 1, w - 2 - (w > 3 ? dark : 0), 1, shadeHex(c, 0.22));
    };
    return { P, R, box };
  }

  // tay: ống tay + bàn tay 2px ở đáy
  function arm(p, x, y, look, h = 11) {
    p.box(x, y, 4, h, look.sleeve, { dark: 0 });
    p.R(x + 1, y + h - 3, 2, 2, look.skin);
    if (look.cuff) p.R(x + 1, y + h - 4, 2, 1, look.cuff);
  }
  function leg(p, x, y, look, w = 5, h = 12, pants = look.pants) {
    p.box(x, y, w, h, pants, { dark: 0 });
    p.R(x + 1, y + h - 3, w - 2, 2, look.shoes);
  }

  function draw(iso, look, dir, frame, fx, fy, { seated = false } = {}) {
    const flip = dir === 'left';
    const d = flip ? 'right' : dir;
    const p = painter(iso, fx, fy, flip);
    const f = look.fat ? 1 : 0;
    if (!seated) { iso.blob(fx, fy, 6, 2, OL); iso.commit(null, 0.22); }

    if (d === 'down' || d === 'up') {
      const lift = frame === 'a' ? [1, 0] : frame === 'b' ? [0, 1] : [0, 0];
      const sw = frame === 'a' ? [1, 0] : frame === 'b' ? [0, 1] : [0, 0];
      if (!seated) { leg(p, 3, 20 - lift[0], look); leg(p, 8, 20 - lift[1], look); }
      arm(p, 0 - f, 10 + sw[0], look);
      arm(p, 12 + f, 10 + sw[1], look);
      p.box(3 - f, 9, 10 + 2 * f, 12, look.top);
      look.torso && look.torso(p, d, f);
      p.box(3, 0, 10, 10, look.skin);
      if (d === 'down') { look.face && look.face(p, 'down'); look.hair && look.hair(p, 'down'); }
      else look.hair && look.hair(p, 'up');
    } else {
      const s = frame === 'a' ? 2 : frame === 'b' ? -2 : 0;
      if (!seated) {
        leg(p, 5 - s, 20, look, 5, 12, shadeHex(look.pants, -0.2));   // chân sau
        leg(p, 6 + s, 20, look, 5, 12);                                // chân trước
      }
      arm(p, 6 - s, 10, look, 11);                                      // tay sau (bị thân che phần lớn)
      p.box(5 - f, 9, 6 + 2 * f + (look.fat ? 1 : 0), 12, look.top);
      look.torso && look.torso(p, 'right', f);
      arm(p, 6 + s, 10, look, 11);                                      // tay trước
      p.box(3, 0, 10, 10, look.skin);
      look.face && look.face(p, 'right');
      look.hair && look.hair(p, 'right');
    }
    iso.commit(null);
  }

  // ------------------------------------------------------------------
  //  DÀN NHÂN VẬT  (mặt trong của đầu: x4..11, y1..8)
  // ------------------------------------------------------------------
  const EYE_W = '#f8f8f8';
  function eyes(p, d, iris, y = 5) {
    if (d === 'down') { p.R(5, y, 2, 1, EYE_W); p.P(6, y, iris); p.R(9, y, 2, 1, EYE_W); p.P(9, y, iris); }
    else if (d === 'right') { p.R(9, y, 2, 1, EYE_W); p.P(10, y, iris); }
  }

  const BOSS = {
    fat: true,
    skin: '#f2c49b', top: '#3f4d78', sleeve: '#3f4d78', pants: '#46465e', shoes: '#6b4c2c',
    torso(p, d, f) {
      if (d === 'down') {
        p.R(6, 10, 4, 10, '#f8f8f8');                       // sơ mi
        p.R(5, 15, 6, 4, '#f8f8f8');                        // bụng
        p.R(7, 10, 2, 6, '#d93232'); p.P(8, 15, '#a13a30'); // cà vạt
        p.R(3 - f, 19, 10 + 2 * f, 1, '#2a2a3c'); p.P(8, 19, '#f8d239');   // thắt lưng
      } else if (d === 'right') {
        p.R(10, 10, 2, 9, '#f8f8f8'); p.P(11, 11, '#d93232'); p.P(11, 12, '#d93232');
        p.R(5, 19, 8, 1, '#2a2a3c');
      } else {
        p.R(7, 11, 2, 8, '#34406a');
      }
    },
    face(p, d) {
      eyes(p, d, '#3a2a20');
      if (d === 'down') {
        p.R(5, 4, 2, 1, '#9e9e9f'); p.R(9, 4, 2, 1, '#9e9e9f');   // lông mày
        p.R(7, 6, 2, 1, '#d99a72');                               // mũi
        p.R(5, 7, 6, 1, '#a8a8a8');                               // ria mép
        p.P(4, 6, '#f69784'); p.P(11, 6, '#f69784');              // má hồng
      } else {
        p.R(9, 4, 2, 1, '#9e9e9f'); p.P(12, 6, '#f2c49b'); p.R(9, 7, 3, 1, '#a8a8a8');
      }
    },
    hair(p, d) {
      if (d === 'down') {
        p.R(4, 3, 1, 4, '#cbcbcb'); p.R(11, 3, 1, 4, '#a8a8a8');   // tóc mai bạc
        p.P(6, 1, '#a8a8a8'); p.P(8, 1, '#a8a8a8'); p.P(9, 2, '#a8a8a8');   // vài cọng tóc
        p.R(5, 1, 1, 1, '#ffffff');                                 // đầu hói bóng
      } else if (d === 'up') {
        p.R(4, 4, 8, 4, '#cbcbcb'); p.R(10, 4, 2, 4, '#a8a8a8');
        p.P(6, 1, '#a8a8a8'); p.P(8, 1, '#a8a8a8'); p.R(5, 2, 1, 1, '#ffffff');
      } else {
        p.R(4, 3, 4, 5, '#cbcbcb'); p.P(6, 5, '#d99a72');           // tóc bạc + tai
        p.P(8, 1, '#a8a8a8'); p.P(10, 1, '#a8a8a8'); p.P(7, 1, '#ffffff');
      }
    },
  };

  const DEV = {
    skin: '#f2c49b', top: '#f2b22b', sleeve: '#f2b22b', pants: '#5a7fae', shoes: '#f0f0f0', cuff: '#d99a2a',
    torso(p, d) {
      if (d === 'down') {
        p.P(6, 10, '#f8f8f8'); p.P(6, 11, '#f8f8f8'); p.P(9, 10, '#f8f8f8'); p.P(9, 11, '#f8f8f8');   // dây rút
        p.R(5, 15, 6, 3, '#d99a2a');                                  // túi bụng
      } else if (d === 'up') {
        p.R(5, 10, 6, 2, '#d99a2a');                                  // mũ trùm
      } else {
        p.R(6, 10, 2, 2, '#d99a2a');
      }
    },
    face(p, d) {
      eyes(p, d, '#3b6fd1');
      if (d === 'down') { p.R(7, 6, 2, 1, '#d99a72'); p.R(6, 7, 4, 1, '#c97a62'); }
      else { p.P(12, 6, '#f2c49b'); p.R(10, 7, 2, 1, '#c97a62'); }
    },
    hair(p, d) {
      const H = '#7a4a2e', H2 = '#5c3620', PHONE = '#46465e';
      if (d === 'down') {
        p.R(4, 1, 8, 2, H); p.R(4, 1, 8, 1, '#9a6440');
        p.P(4, 3, H); p.P(11, 3, H2); p.P(6, 3, H); p.P(10, 3, H);      // mái lởm chởm
        p.R(3, 0, 10, 1, PHONE);                                         // quai tai nghe
        p.R(2, 3, 2, 4, PHONE); p.R(12, 3, 2, 4, PHONE);                 // chụp tai
        p.P(2, 4, '#d93232'); p.P(13, 4, '#d93232');
      } else if (d === 'up') {
        p.R(4, 1, 8, 7, H); p.R(4, 1, 8, 1, '#9a6440'); p.R(10, 2, 2, 6, H2);
        p.R(3, 0, 10, 1, PHONE); p.R(2, 3, 2, 4, PHONE); p.R(12, 3, 2, 4, PHONE);
      } else {
        p.R(4, 1, 8, 2, H); p.R(4, 3, 4, 4, H); p.P(9, 3, H);
        p.R(3, 0, 10, 1, PHONE); p.R(5, 3, 3, 4, PHONE); p.R(6, 4, 1, 2, '#6a6a84');
      }
    },
  };

  global.Blocky = { draw, BOSS, DEV, OL };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// Ảnh nền KHÔNG nằm trong repo (asset trả phí). Bản gửi riêng sẽ nhúng sẵn vào BG_DATA.
const BG_DATA = window.BG_DATA || 'office-bg.png';
const W = 416, H = 384;

// ---------- bảng sprite ----------
(function sheet() {
  const cast = [['BOSS', Blocky.BOSS], ['DEV', Blocky.DEV]];
  const dirs = ['down', 'up', 'right', 'left'], frames = ['idle', 'a', 'b'];
  const cw = 22, ch = 40, SW = dirs.length * frames.length * cw + 8, SH = cast.length * ch + 8;
  const iso = Iso.createIso(SW, SH, { ox: 0, oy: 0, bg: '#e8e4ee' }); iso.clear();
  cast.forEach(([, look], r) => {
    let c = 0;
    for (const d of dirs) for (const f of frames) { Blocky.draw(iso, look, d, f, 4 + c * cw + 11, 4 + r * ch + 35); c++; }
  });
  const cv = document.getElementById('sheet'); iso.finish(cv);
  cv.style.width = SW * 4 + 'px'; cv.style.height = SH * 4 + 'px';
})();

// ---------- cảnh đi lại ----------
const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const layer = document.createElement('canvas');
let bg = null;
function loadBg(src) { const im = new Image(); im.onload = () => (bg = im); im.src = src; }
loadBg(BG_DATA);
document.getElementById('file').onchange = (e) => { const f = e.target.files[0]; if (f) loadBg(URL.createObjectURL(f)); };

// lộ trình: danh sách điểm, đi vòng lặp; dừng ngắn ở mỗi điểm
const WALKERS = [
  { look: Blocky.BOSS, path: [[250, 126], [380, 126], [380, 150], [250, 150]], speed: 18 },
  { look: Blocky.DEV, path: [[30, 300], [170, 300], [170, 350], [30, 350]], speed: 26 },
];
function segInfo(w, t) {
  const pts = w.path, legs = [];
  let total = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const len = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
    legs.push({ a, b, dur: len / w.speed }); total += len / w.speed + 0.8;
  }
  let u = t % total;
  for (const L of legs) {
    if (u < 0.8) return { x: L.a[0], y: L.a[1], dir: 'down', moving: false };
    u -= 0.8;
    if (u < L.dur) {
      const k = u / L.dur, dx = L.b[0] - L.a[0], dy = L.b[1] - L.a[1];
      const dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
      return { x: L.a[0] + dx * k, y: L.a[1] + dy * k, dir, moving: true };
    }
    u -= L.dur;
  }
  return { x: pts[0][0], y: pts[0][1], dir: 'down', moving: false };
}

const t0 = performance.now();
function tick(now) {
  const t = (now - t0) / 1000;
  const iso = Iso.createIso(W, H, { ox: 0, oy: 0, bg: 'transparent' }); iso.clear();
  const states = WALKERS.map((w, i) => ({ w, s: segInfo(w, t + i * 3) })).sort((a, b) => a.s.y - b.s.y);
  for (const { w, s } of states) {
    const step = s.moving ? ['a', 'idle', 'b', 'idle'][Math.floor(t * 7) % 4] : 'idle';
    Blocky.draw(iso, w.look, s.dir, step, Math.round(s.x), Math.round(s.y));
  }
  iso.finish(layer);
  ctx.fillStyle = '#9c9cae'; ctx.fillRect(0, 0, W, H);
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  ctx.drawImage(layer, 0, 0);
  requestAnimationFrame(tick);
}
function fit() { const k = Math.max(1, Math.floor(Math.min((innerWidth - 20) / W, 3))); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; }
addEventListener('resize', fit); fit();
requestAnimationFrame(tick);
</script>
