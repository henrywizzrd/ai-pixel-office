<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhân vật chibi 3/4 · đi lại trong phòng</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #dbb378; font-family: ui-monospace, Consolas, monospace; color: #24120c; display: flex; flex-direction: column; align-items: center; }
  .bar { display: flex; gap: 6px; padding: 10px; }
  button { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 4px; cursor: pointer; background: #f4efe6; color: #24120c; border: 2px solid #24120c; }
  button.on { background: #24120c; color: #f4efe6; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
  <div class="bar"><button id="btn-pause">Tạm dừng</button><span style="font-size:12px;align-self:center">Sếp đi dọc tường phải · Dev đi dọc tường trái · bên dưới là bảng 4 hướng × 3 khung</span></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <canvas id="sheet" style="margin:10px auto 24px;display:block"></canvas>
<script src="../lib/iso-engine.js"></script>
<script src="../lib/items.js"></script>
<script src="../lib/items-2.js"></script>
<script src="../lib/rooms.js"></script>
<script src="../lib/chars2.js"></script>
<script src="../lib/cast2.js"></script>
<script>
const RX = 128, RY = 120, WH = 84, W = 330, H = 290;
const OX = RY + (W - RX - RY) / 2 + 2, OY = WH + 34;
const item = (id) => ITEMS.find((i) => i.id === id);
const v = (id, name) => item(id).variants.find((x) => x.name === name) || item(id).variants[0];

// 1) Vẽ phòng tĩnh 1 lần
const roomCanvas = document.createElement('canvas');
(function () {
  const iso = Iso.createIso(W, H, { ox: OX, oy: OY, bg: '#dbb378' });
  iso.clear();
  Rooms.thickRoom(iso, RX, RY, WH, 'red');
  item('big-plant').draw(iso.at('R', 2, 2), iso, v('big-plant', 'Cây bụi'));
  item('sofa-2').draw(iso.at('R', 24, 1), iso, v('sofa-2', 'Vải xám'));
  item('workstation').draw(iso.at('L', 26, 1), iso, v('workstation', 'Bàn nâu đỏ · màn đen'));
  const D2 = 72;
  item('desk').draw(iso.at('L', D2, 1), iso, v('desk', 'Gỗ nâu đỏ'));
  item('monitor').draw(iso.at('L', D2 + 1, 2), iso, v('monitor', 'Code'), 24);
  item('keyboard').draw(iso.at('L', D2 + 1, 15), iso, v('keyboard', 'Kem'), 24);
  item('laptop').draw(iso.at('L', D2 + 24, 9), iso, v('laptop', 'Bạc'), 24);
  iso.finish(roomCanvas);
})();

// 2) Nhân vật: đi qua lại giữa 2 điểm, dừng 1 giây ở mỗi đầu (quay mặt ra người xem)
const walkers = [
  { look: CAST2.boss, a: [50, 66], b: [112, 66], t: 0 },
  { look: CAST2.dev, a: [52, 44], b: [52, 108], t: 1.5 },
];
const SPEED = 20, PAUSE = 1.2;
// hướng đi trong thế giới iso → hướng nhìn của nhân vật
function dirFor(dx, dy) {
  if (dx > 0) return 'se';   // xuống-phải
  if (dx < 0) return 'nw';   // lên-trái
  if (dy > 0) return 'sw';   // xuống-trái
  return 'ne';               // lên-phải
}
function stateAt(w, t) {
  const dx = w.b[0] - w.a[0], dy = w.b[1] - w.a[1];
  const len = Math.hypot(dx, dy), leg = len / SPEED, cycle = 2 * (leg + PAUSE);
  let u = (t + w.t) % cycle;
  const seg = [[0, leg, 0, 1], [leg, leg + PAUSE, 1, 1], [leg + PAUSE, 2 * leg + PAUSE, 1, 0], [2 * leg + PAUSE, cycle, 0, 0]];
  for (const [s0, s1, p0, p1] of seg) if (u < s1) {
    const k = (u - s0) / (s1 - s0), p = p0 + (p1 - p0) * k;
    const x = w.a[0] + dx * p, y = w.a[1] + dy * p;
    if (p0 === p1) return { x, y, dir: dx ? 'se' : 'sw', frame: 1 };
    return { x, y, dir: dirFor(dx * (p1 - p0), dy * (p1 - p0)), frame: [0, 1, 2, 1][Math.floor(t * 7) % 4] };
  }
}

const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const layer = document.createElement('canvas');
let paused = false, t0 = performance.now(), tPaused = 0;
function tick(now) {
  const t = (paused ? tPaused : now - t0) / 1000;
  const iso = Iso.createIso(W, H, { ox: OX, oy: OY, bg: 'transparent' });
  iso.clear();
  walkers.map((w) => ({ w, s: stateAt(w, t) })).sort((A, B) => A.s.x + A.s.y - (B.s.x + B.s.y)).forEach(({ w, s }) => {
    const [sx, sy] = iso.proj(s.x, s.y, 0);
    Chars2.drawFrame(iso, w.look, s.dir, s.frame, sx, sy);
  });
  iso.finish(layer);
  ctx.clearRect(0, 0, W, H); ctx.drawImage(roomCanvas, 0, 0); ctx.drawImage(layer, 0, 0);
  requestAnimationFrame(tick);
}
function fit() { const st = document.getElementById('stage').getBoundingClientRect(); const s = Math.max(1, Math.floor(Math.min(st.width / W, st.height / H))); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
document.getElementById('btn-pause').onclick = (e) => { paused = !paused; if (paused) tPaused = performance.now() - t0; else t0 = performance.now() - tPaused; e.target.classList.toggle('on', paused); };
window.addEventListener('resize', fit); fit();

// Bảng sprite: mỗi nhân vật 4 hướng × 3 khung
(function () {
  const CW = 22, W2 = CW * 12 + 4, H2 = 42 * 2 + 6, K = 4;
  const iso = Iso.createIso(W2, H2, { ox: 0, oy: 0, bg: '#dbb378' }); iso.clear();
  ['boss', 'dev'].forEach((id, r) => {
    let i = 0;
    for (const d of ['se', 'sw', 'ne', 'nw']) for (let f = 0; f < 3; f++) Chars2.drawFrame(iso, CAST2[id], d, f, 12 + CW * i++, 41 + r * 44);
  });
  const c = document.getElementById('sheet'); iso.finish(c); c.style.width = W2 * K + 'px'; c.style.height = H2 * K + 'px';
})();
requestAnimationFrame(tick);
</script>
</body>
</html>
